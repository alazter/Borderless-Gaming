name: Build Borderless Gaming

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore NuGet packages
        run: nuget restore BorderlessGaming.sln

      - name: Build Solution (Release)
        run: msbuild BorderlessGaming.sln /p:Configuration=Release /v:minimal

      - name: Package Release ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "BorderlessGaming/bin/Release/*" -DestinationPath "BorderlessGaming-Release.zip" -Force

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BorderlessGaming-Release
          path: BorderlessGaming-Release.zip
